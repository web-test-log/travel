    </div>
  </div>

  <p class="note">地図は簡略化したもので、ピンの位置と県境はおおよその目安です。</p>

// Simplified outline of Shikoku [lon, lat]
const OUTLINE = [
  [132.0,33.35],[132.25,33.45],[132.42,33.45],[132.7,33.9],[133.0,34.05],
  [133.28,34.2],[133.5,34.25],[133.85,34.32],[134.05,34.35],[134.6,34.22],
  [134.75,34.12],[134.6,34.0],[134.72,33.85],[134.55,33.7],[134.4,33.6],
  [134.25,33.5],[134.18,33.25],[133.9,33.45],[133.6,33.4],[133.5,33.55],
  [133.3,33.35],[133.0,32.75],[132.85,32.95],[132.6,33.0],[132.56,33.22],[132.25,33.4]
];

// Approximate prefecture borders [lon, lat] polylines (rough)
const BORDERS = [
  [[133.5,34.25],[133.55,34.05],[133.62,33.85]],
  [[134.3,34.22],[134.2,34.03],[134.0,33.95]],
  [[133.62,33.85],[133.9,33.92],[134.0,33.95]],
  [[132.9,33.1],[132.85,33.35],[133.0,33.55],[133.25,33.7],[133.62,33.85]],
  [[133.62,33.85],[133.7,33.65],[133.95,33.6],[134.3,33.55]]
];

const FULL = { x: 0, y: 0, w: 320, h: 272 };
function proj(lo, la) { return [(lo - 132) * 110 + 8, (34.6 - la) * 132 + 6]; }

const SVGNS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("map");
const bordersG = document.getElementById("borders");
const landG = document.getElementById("land");
const labelG = document.getElementById("labels");
const pinG = document.getElementById("pins");
const captionEl = document.getElementById("caption");

(function drawStatic() {
  const path = document.createElementNS(SVGNS, "path");
  path.setAttribute("class", "land");
  path.setAttribute("d", "M" + OUTLINE.map(([lo, la]) => proj(lo, la).map(v => v.toFixed(1)).join(" ")).join(" L") + " Z");
  landG.appendChild(path);
  const island = document.createElementNS(SVGNS, "ellipse");
  const [ix, iy] = proj(134.25, 34.49);
  island.setAttribute("cx", ix); island.setAttribute("cy", iy);
  island.setAttribute("rx", 9); island.setAttribute("ry", 5);
  island.setAttribute("class", "land");
  landG.appendChild(island);

  BORDERS.forEach(line => {
    const p = document.createElementNS(SVGNS, "path");
    p.setAttribute("class", "pborder");
    p.setAttribute("d", "M" + line.map(([lo, la]) => proj(lo, la).map(v => v.toFixed(1)).join(" ")).join(" L"));
    bordersG.appendChild(p);
  });

  [["香川", 34.22, 133.95], ["徳島", 33.95, 134.25], ["高知", 33.45, 133.45], ["愛媛", 33.6, 132.85]].forEach(([n, la, lo]) => {
    const [x, y] = proj(lo, la);
    const t = document.createElementNS(SVGNS, "text");
    t.setAttribute("x", x); t.setAttribute("y", y);
    t.setAttribute("text-anchor", "middle");
    t.setAttribute("class", "plabel");
    t.textContent = n;
    labelG.appendChild(t);
  });
})();

const STORE = "shikoku-stamps";
let stamps = new Set();
try { stamps = new Set(JSON.parse(localStorage.getItem(STORE) || "[]")); } catch (e) {}
function saveStamps() { try { localStorage.setItem(STORE, JSON.stringify([...stamps])); } catch (e) {} }

function key(item) { return item.p + ":" + item.t + ":" + item.n; }

let current = "all";
let typeFilter = "all";
let lastItems = [];
let focusSet = new Set();
const tabsEl = document.getElementById("tabs");
const typesEl = document.getElementById("types");
const outEl = document.getElementById("out");
const qEl = document.getElementById("q");
const sumEl = document.getElementById("sum");

function filtered() {
  const q = qEl.value.trim();
  return DATA.map((d, i) => ({ ...d, idx: i })).filter(d => {
    if (current === "stamp" && !stamps.has(key(d))) return false;
    if (current !== "all" && current !== "stamp" && d.p !== current) return false;
    if (typeFilter !== "all" && d.t !== typeFilter) return false;
    return !q || (d.n + d.a + d.d).includes(q);
  });
}

function setView() {
  let v = FULL;
  if (current !== "all" && current !== "stamp") {
    const pts = DATA.filter(d => d.p === current).map(d => proj(d.lo, d.la));
    const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
    const pad = 22;
    const x0 = Math.min(...xs) - pad, x1 = Math.max(...xs) + pad;
    const y0 = Math.min(...ys) - pad, y1 = Math.max(...ys) + pad;
    let w = Math.max(x1 - x0, 90), h = Math.max(y1 - y0, 90 * FULL.h / FULL.w);
    if (w / h > FULL.w / FULL.h) { h = w * FULL.h / FULL.w; } else { w = h * FULL.w / FULL.h; }
    const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
    v = { x: cx - w / 2, y: cy - h / 2, w, h };
  }
  svg.setAttribute("viewBox", [v.x, v.y, v.w, v.h].map(n => n.toFixed(2)).join(" "));
}

// Map units per screen pixel, so bubble size and grouping stay constant on screen.
function unitsPerPx() {
  const r = svg.getBoundingClientRect();
  const vb = svg.viewBox.baseVal;
  const s = Math.min(r.width / vb.width, r.height / vb.height);
  return (s > 0 && isFinite(s)) ? 1 / s : vb.width / 300;
}

function renderTabs() {
  tabsEl.innerHTML = "";
  Object.keys(PREF).forEach(k => {
    const count = k === "all" ? DATA.length
      : k === "stamp" ? DATA.filter(d => stamps.has(key(d))).length
      : DATA.filter(d => d.p === k).length;
    const b = document.createElement("button");
    b.className = "tab";
    b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", String(k === current));
    b.textContent = PREF[k];
    const c = document.createElement("span");
    c.className = "count";
    c.textContent = count;
    b.appendChild(c);
    b.addEventListener("click", () => { current = k; focusSet = new Set(); render(); });
    tabsEl.appendChild(b);
  });
}

function renderTypes() {
  typesEl.innerHTML = "";
  Object.keys(TYPES).forEach(k => {
    const b = document.createElement("button");
    b.className = "tab";
    b.setAttribute("aria-pressed", String(k === typeFilter));
    b.setAttribute("aria-selected", String(k === typeFilter));
    b.textContent = TYPES[k];
    b.addEventListener("click", () => { typeFilter = k; focusSet = new Set(); render(); });
    typesEl.appendChild(b);
  });
}

// Greedy grouping: every group's seed is at least `thr` away from every other seed.
function clusterItems(items, thr) {
  const used = new Array(items.length).fill(false);
  const clusters = [];
  items.forEach((it, i) => {
    if (used[i]) return;
    used[i] = true;
    const p = proj(it.lo, it.la);
    const members = [it];
    items.forEach((jt, j) => {
      if (used[j]) return;
      const q = proj(jt.lo, jt.la);
      if (Math.hypot(p[0] - q[0], p[1] - q[1]) < thr) { members.push(jt); used[j] = true; }
    });
    clusters.push({ x: p[0], y: p[1], members });
  });
  return clusters;
}

function typeClass(members) {
  if (members.every(m => m.t === "spot")) return "spot";
  if (members.every(m => m.t === "food")) return "food";
  return "mixed";
}

function renderMap(items) {
  pinG.innerHTML = "";
  const k = unitsPerPx();
  const R = 11 * k;
  const thr = 26 * k;
  clusterItems(items, thr).forEach(c => {
    const g = document.createElementNS(SVGNS, "g");
    g.setAttribute("class", "bubble");
    g.setAttribute("tabindex", "0");
    g.setAttribute("role", "button");
    g.setAttribute("aria-label", c.members.map(m => m.n).join("、"));

    const hot = c.members.some(m => focusSet.has(m.idx));

    // Selected bubble gets an outer accent ring so it stands out from the rest.
    if (hot) {
      const halo = document.createElementNS(SVGNS, "circle");
      halo.setAttribute("cx", c.x.toFixed(2));
      halo.setAttribute("cy", c.y.toFixed(2));
      halo.setAttribute("r", (R * 1.6).toFixed(2));
      halo.setAttribute("class", "halo");
      halo.setAttribute("style", "stroke-width:" + (2.5 * k).toFixed(2));
      g.appendChild(halo);
    }

    const circ = document.createElementNS(SVGNS, "circle");
    circ.setAttribute("cx", c.x.toFixed(2));
    circ.setAttribute("cy", c.y.toFixed(2));
    circ.setAttribute("r", R.toFixed(2));
    circ.setAttribute("class", "pin " + typeClass(c.members) + (hot ? " hot" : ""));
    circ.setAttribute("style", "stroke-width:" + ((hot ? 2.5 : 1) * k).toFixed(2));
    g.appendChild(circ);

    const t = document.createElementNS(SVGNS, "text");
    t.setAttribute("x", c.x.toFixed(2));
    t.setAttribute("y", (c.y + 3.6 * k).toFixed(2));
    t.setAttribute("class", "ctext");
    t.setAttribute("font-size", (11 * k).toFixed(2));
    t.textContent = c.members.length;
    g.appendChild(t);

    const open = e => { e.stopPropagation(); focusFromCluster(c); };
    g.addEventListener("click", open);
    g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(e); } });
    pinG.appendChild(g);
  });
}

function updateCaption() {
  const names = lastItems.filter(d => focusSet.has(d.idx)).map(d => d.n);
  captionEl.textContent = names.length ? "地図で選択中：" + names.join("、") : "";
}

function applyListFocus() {
  outEl.querySelectorAll(".item").forEach(li => {
    const on = focusSet.has(Number(li.dataset.idx));
    li.classList.toggle("focus", on);
    const name = li.querySelector(".name");
    let badge = name && name.querySelector(".fbadge");
    if (on && name && !badge) {
      badge = document.createElement("span");
      badge.className = "fbadge";
      badge.textContent = "地図で表示中";
      name.insertBefore(badge, name.firstChild);
    } else if (!on && badge) {
      badge.remove();
    }
  });
}

function clearFocus() {
  focusSet = new Set();
  renderMap(lastItems);
  applyListFocus();
  updateCaption();
}

function focusFromCluster(c) {
  focusSet = new Set(c.members.map(m => m.idx));
  renderMap(lastItems);
  applyListFocus();
  updateCaption();
}

function focusFromItem(idx) {
  const cl = clusterItems(lastItems, 26 * unitsPerPx()).find(c => c.members.some(m => m.idx === idx));
  focusSet = new Set(cl ? cl.members.map(m => m.idx) : [idx]);
  renderMap(lastItems);
  applyListFocus();
  updateCaption();
}

svg.addEventListener("click", e => {
  if (!e.target.closest(".bubble") && focusSet.size) clearFocus();
});

function updateSum() {
  sumEl.textContent = "行きたいスタンプ：" + stamps.size + "件（この端末のブラウザに保存されます）";
}

function section(title, items) {
  const h = document.createElement("h2");
  h.textContent = title + "（" + items.length + "）";
  outEl.appendChild(h);
  if (!items.length) {
    const e = document.createElement("p");
    e.className = "empty";
    e.textContent = current === "stamp" ? "行きたいスタンプはまだありません" : "該当なし";
    outEl.appendChild(e);
    return;
  }
  const ul = document.createElement("ul");
  ul.className = "list";
  items.forEach(item => {
    const li = document.createElement("li");
    const k = key(item);
    li.className = "item";
    li.dataset.idx = item.idx;
    li.addEventListener("click", () => focusFromItem(item.idx));

    const body = document.createElement("div");
    body.className = "body";
    const name = document.createElement("div");
    name.className = "name";
    name.textContent = item.n;
    if (current === "all" || current === "stamp") {
      const pr = document.createElement("span");
      pr.className = "pref";
      pr.textContent = PREF[item.p];
      name.appendChild(pr);
    }
    const desc = document.createElement("div");
    desc.className = "desc";
    desc.textContent = (item.a ? item.a + "：" : "") + item.d;
    body.appendChild(name);
    body.appendChild(desc);

    const sb = document.createElement("button");
    sb.type = "button";
    sb.className = "stamp";
    const on = stamps.has(k);
    sb.setAttribute("aria-pressed", String(on));
    sb.textContent = on ? "取り消す" : "行きたい";
    sb.addEventListener("click", e => {
      e.stopPropagation();
      if (stamps.has(k)) stamps.delete(k); else stamps.add(k);
      saveStamps();
      // In the 行きたい tab, cancelling removes the row, so redraw the page.
      if (current === "stamp" && !stamps.has(k)) { render(); return; }
      const now = stamps.has(k);
      sb.setAttribute("aria-pressed", String(now));
      sb.textContent = now ? "取り消す" : "行きたい";
      renderTabs();
      updateSum();
    });

    li.appendChild(body);
    li.appendChild(sb);
    ul.appendChild(li);
  });
  outEl.appendChild(ul);
}

function render() {
  renderTabs();
  renderTypes();
  setView();
  lastItems = filtered();
  renderMap(lastItems);
  outEl.innerHTML = "";
  if (typeFilter !== "food") section("観光地・スポット", lastItems.filter(d => d.t === "spot"));
  if (typeFilter !== "spot") section("ご飯屋さん・グルメ", lastItems.filter(d => d.t === "food"));
  applyListFocus();
  updateCaption();
  updateSum();
}

qEl.addEventListener("input", () => { focusSet = new Set(); render(); });
window.addEventListener("resize", () => { renderMap(lastItems); applyListFocus(); });
render();
</script>
